; ---------------------------------------------------------------------------
; Seeed Studio XIAO ESP32-C5 - dual-band (2.4 GHz + 5 GHz) Wi-Fi 6 board
;
; This env needs a newer Arduino core than the other environments: ESP32-C5
; support only exists from Arduino core 3.2 / ESP-IDF 5.4 upwards. It is pinned
; to Arduino 3.3.12 / ESP-IDF 5.5.5 while the older boards stay on 51.03.04,
; so their builds are unaffected.
;
; 5 GHz notes:
;  - Router (STA) mode scans and connects on either band.
;  - AP mode broadcasts on 5 GHz when the configured channel is >= 36, and on
;    2.4 GHz otherwise (channel 1 by default).
;  - Keep AP channel <= 13 for mixed setups: older poi (C3/S3) are 2.4 GHz
;    only and ESP-NOW sync does not work across bands.
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c5]
board = seeed_xiao_esp32c5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
upload_speed = 460800
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.psram = enabled

lib_deps =
	ESP32Async/AsyncTCP @ 3.3.8
	ESP32Async/ESPAsyncWebServer @ 3.7.4
	ayushsharma82/ElegantOTA @ 3.1.7
	bblanchon/ArduinoJson @ 6.21.1
	fastled/FastLED @ 3.10.9 ; 3.10.4+ is the first release with ESP32-C5 support (RMT5)
	arduino-libraries/NTPClient @ 3.2.1
extra_scripts = ./littlefsbuilder.py
build_flags=
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1 ; for OTA update
    -D ESP32_ARDUINO_NO_RGB_BUILTIN ; no addressable RGB on this board
    -D ARDUINO_USB_MODE=1 ; enables Serial communication
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; enables Serial communication
    -D CONFIG_ARDUINO_ELEGANTOTA_TASK_STACK_SIZE=32768 ; for OTA update
	-D DATAPIN=1 ; XIAO D0 / GPIO1
	-D CLOCKPIN=2 ; unused with WS2812 LEDs, kept off the PSRAM/flash pins
	-D NUMLEDS=37 ; number of LED's plus one - needed for some WS2812 strips
	-D NUMPX=36 ; number of LED's
	-D MAXPX=12000 ; calculate according to size of image wanted. Too large means out of memory issues.
	-D LED_APA102=false ; true for APA102, false for WS2812
	-D auxillary=false ; false for main poi, true for auxillary. Auxillary do not work alone.
	-D C_THREE=false ; not a C3 Super Mini board (skips the C3-only TX power tweak)
	-D DUAL_BAND_WIFI=true ; radio supports 2.4 GHz and 5 GHz
	-D DEFAULT_AP_CHANNEL=36 ; start the setup AP on 5 GHz (use 1-13 for 2.4 GHz-only compatibility)
	-D FASTLED_ESP32_HAS_PARLIO=0 ; PARLIO driver fails on this board (asserts) - use RMT5
	-D AP_NAME=\"Smart_Poi9\"
	-D AP_PASS=\"SmartOne\"
	-D SERIAL_DEBUG=1 ; set to 1 to enable Serial debug output
